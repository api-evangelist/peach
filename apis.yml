aid: peach
name: Peach
description: 'Peach (Peach, inc., ticker PEAC on secondary markets) was a Waltham, Massachusetts
  direct-sales retailer of intimate apparel, basics and athleisure for women, founded in 2013 by
  Janet Kraus (CEO) and Derek Ohly. It blended an in-home personal-styling experience delivered by a
  network of independent stylists with an online replenishment storefront at discoverpeach.com,
  raising roughly $10.2M before winding down. The company has since closed: its own homepage carries
  a farewell notice ("Peach has closed its doors") and refers customers to Cabi Clothing. Peach was a
  consumer retail brand, not a software vendor — it never operated a developer program, published no
  API documentation, and no machine-readable contract of any kind was found on its surviving surface.'
